name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE: ghcr.io/${{ github.repository }}
  JF_URL: https://trialpghcwm.jfrog.io
  ARTIFACT_PATH: golden-path-libs-snapshot-local/com/goodintechnology/devex-golden-path/0.1.0-SNAPSHOT

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Unit Test
        run: mvn -B test

      # GitHub pushes the template's initial commit to every repo created via "Use this
      # template" before anyone has run scripts/init-service.sh, so this same workflow file
      # runs there too — still declaring the *template's* identity (Maven artifact, Sonar
      # project key, Artifactory path). Everything below is guarded to the template repo
      # itself so a freshly-created, not-yet-initialized service can't publish analysis or
      # artifacts under the template's identity. Compile/Unit Test above still run everywhere
      # as a quick sanity check. init-service.sh replaces this whole file with one that calls
      # reusable-ci.yml, which is correctly scoped to the new repo, so this guard only matters
      # pre-initialization.
      - name: SonarCloud Scan
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.token=$SONAR_TOKEN

      - name: SonarCloud Quality Gate Check
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: target/sonar/report-task.txt

      - name: Setup JFrog CLI
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5.1.0
        env:
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      - name: Xray Audit
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        run: jf audit --watches=golden-path-security-watch

      - name: Package
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        run: mvn -B package -DskipTests

      - name: Publish to Artifactory
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        run: |
          jf rt upload target/devex-golden-path-0.1.0-SNAPSHOT.jar \
            "$ARTIFACT_PATH/devex-golden-path-0.1.0-SNAPSHOT.jar" \
            --build-name=devex-golden-path --build-number=${{ github.run_number }}
          jf rt upload target/classes/META-INF/sbom/application.cdx.json \
            "$ARTIFACT_PATH/devex-golden-path-0.1.0-SNAPSHOT-bom.json" \
            --build-name=devex-golden-path --build-number=${{ github.run_number }}

      - name: Publish Build Info
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        run: jf rt build-publish devex-golden-path ${{ github.run_number }}

      - name: Build container image
        if: github.repository == 'goodintechnology-com/devex-golden-path'
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Log in to GHCR
        if: github.repository == 'goodintechnology-com/devex-golden-path' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image
        if: github.repository == 'goodintechnology-com/devex-golden-path' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE" --all-tags
